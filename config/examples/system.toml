# 运行环境、时区、模型路由和资源上限。
# API key 通过 DSH 凭据或环境变量提供，不写进配置文件。
schema_version = 1
environment = "development"

[time]
# 安静时段只限制主动联系，不阻止回复用户主动发来的消息。
timezone = "Asia/Shanghai"
quiet_hours_start = "00:10"
quiet_hours_end = "07:00"

[context]
# 预算按 Unicode 码点计，不冒充上游 tokenizer 的精确 token 数。
# 身份/系统规则和本条消息永不裁剪；超限先删最旧对话，再删相关度最低的记忆。
max_prompt_chars = 20000
max_state_chars = 480
max_memory_items = 5
max_memory_item_chars = 500
max_memory_chars = 3000
# 最近对话的上限不含本条用户消息。
max_history_messages = 40
max_history_chars = 8000
max_message_chars = 4000

[model]
# M3.1 使用电脑上的 Magpie 本地模型路由。地址只能是回环 /v1 端点；
# 精确模型名不会自动替换成 auto/* 路由组。
provider = "magpie"
name = "deepseek/deepseek-flash"
base_url = "http://127.0.0.1:3425/v1"
# 当前 Magpie 未启用鉴权；启用时只在本机环境变量中设置 key。
# api_key_env = "MAGPIE_API_KEY"
timeout_ms = 120000
max_retries = 2
max_output_tokens = 4096

[resources]
# 并发和每日调用额度用于成本与资源熔断。
max_concurrent_model_calls = 2
daily_model_call_limit = 2000

[storage]
# 所有路径都相对于插件的数据目录，不能使用绝对路径或 ..
# 墓碑库必须与主库分开，避免恢复旧主库备份时把删除记录一起回滚。
database = "kanobot.sqlite"
tombstones = "tombstones.sqlite"
backup_dir = "backups"
snapshot_every_events = 100
snapshot_interval_hours = 1
backup_retention = 7
