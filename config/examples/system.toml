# 运行环境、时区、模型路由和资源上限。
# API key 通过环境变量或本地加密 secret 引用提供，配置文件不写值。
schema_version = 1
environment = "development"

[time]
# 安静时段只限制主动联系，不阻止回复用户主动发来的消息。
timezone = "Asia/Shanghai"
quiet_hours_start = "00:10"
quiet_hours_end = "07:00"

[context]
# 预算按 Unicode 码点计，不冒充上游 tokenizer 的精确 token 数。
# 身份/系统规则和本条消息永不裁剪；超限先删最旧对话，再删相关度最低的记忆。
max_prompt_chars = 20000
max_state_chars = 480
max_memory_items = 5
max_memory_item_chars = 500
max_memory_chars = 3000
# 最近对话的上限不含本条用户消息。
max_history_messages = 40
max_history_chars = 8000
max_message_chars = 4000

[model]
# 示例默认使用电脑上的 Magpie 本地模型路由。provider = "magpie" 时地址
# 只能是回环 /v1 端点；精确模型名不会自动替换成 auto/* 路由组。
# 也可改为 "mock"、"dsh"（仅 DSH 插件）或 "openai-compatible"。
provider = "magpie"
# 只有 provider = "dsh" 时才使用宿主里精确的 provider 路由名。
# route = "deepseek-official"
# 当前本机路由可用的精确模型示例，不代表最终主模型选型。
name = "dsdsdsds/deepseek-flash"
base_url = "http://127.0.0.1:3425/v1"
# 当前 Magpie 未启用鉴权；启用时只在本机环境变量中设置 key。
# api_key_env = "MAGPIE_API_KEY"
# 网页设置页也可以写入加密的本地 secret 引用；与环境变量二选一。
# api_key_secret = "<secret reference>"
# 第三方 OpenAI-compatible 默认只接受公开 HTTPS；自建私网端点需显式开启。
allow_private_network = false
timeout_ms = 120000
max_retries = 2
max_output_tokens = 4096
# 可选：仅在 Magpie /v1/models 明确声明该档位时启动。
# 当前 deepseek/deepseek-flash 在默认/high 档会偶发只返回推理、正文为空；
# low 档已通过完整聊天上下文验证。
reasoning_effort = "low"

[vision]
# 视觉模型独立于聊天模型，默认关闭；开启后必须填写精确模型名。
# provider 支持 "magpie"（回环 /v1）或 "openai-compatible"
# （默认 HTTPS；私网/回环需显式 allow_private_network = true）。
enabled = false
# provider = "magpie"
# name = "<exact vision model id>"
# base_url = "http://127.0.0.1:3425/v1"
# api_key_env = "MAGPIE_API_KEY"
# api_key_secret = "<secret reference>"
# allow_private_network = false
# timeout_ms = 120000
# max_retries = 2
# max_output_tokens = 2048
# max_image_bytes = 5242880
# max_description_chars = 2000

[resources]
# 并发和每日调用额度用于成本与资源熔断。
max_concurrent_model_calls = 2
daily_model_call_limit = 2000

[storage]
# 所有路径都相对于插件的数据目录，不能使用绝对路径或 ..
# 墓碑库必须与主库分开，避免恢复旧主库备份时把删除记录一起回滚。
database = "kanobot.sqlite"
tombstones = "tombstones.sqlite"
backup_dir = "backups"
snapshot_every_events = 100
snapshot_interval_hours = 1
backup_retention = 7
